set-environment -g PATH "$HOME/.nix-profile/bin:/etc/profiles/per-user/$USER/bin:/run/current-system/sw/bin:$PATH"
set-option -w -g aggressive-resize on

set -g mouse on
bind-key b set-option status
# set -g status off

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# open new windows in same dir
# tmux set-option default-path "$PWD"
bind c new-window -c "#{pane_current_path}"

# easy session
bind C command-prompt -p "New Session:" "new-session -A -s '%%'"
# TODO: create prompt to select and kill session
bind-key S 'display-popup -w 80% -E "tmux list-sessions | fzf"'

# bind Enter copy-mode
# Easy copy mode
# bind -n M-Enter copy-mode

# VIM -------------------------------------------------------------------------------------------------------
# vim coloring
set-option -ga terminal-overrides ",xterm-256color:Tc"
# like vim split
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
# Copy mode  ------------------------------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
# Set focus-events on (important for Neovim autoread)
set -g focus-events on
# ------------------------------------------------------------------------------------------------


# Set prefix to Alt-Space or backtick
# unbind C-b
set -g prefix M-`
# set -g prefix2 M-Space
set -g prefix2 C-b
# bind M-` send-prefix
# bind M-Space send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g @plugin 'tmux-plugins/tpm'

set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5


# mouse copy
set-option -s set-clipboard off
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"


set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'ofirgall/tmux-window-name'
set -g set-clipboard on
set -g @override_copy_command 'xclip -i -selection clipboard'
set -g @yank_selection 'clipboard'
set -as terminal-features ',*:clipboard'

# Persist Sessions -------------------------------
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'
set -g @resurrect-strategy-nvim 'session'
# save sessions on detach
bind d run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh && tmux detach'
# ------------------------------------------------

# THEMES -----------------------------------------
set-option -g status-justify centre
set -g @plugin 'dracula/tmux'
# https://draculatheme.com/tmux
set -g @dracula-plugins "cpu-usage ram-usage battery time"
set -g @dracula-show-powerline false
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-border-contrast true 
set -g @dracula-show-empty-plugins false

# color theme ------------------------------------
set -g @dracula-colors "
# simple catppuccin Color Pallette
pink='#cba6f7'
orange='#fab387'
yellow='#f9e2af'
green='#a6e3a1'
cyan='#89dceb'
light_purple='#b4befe'
white='#cdd6f4'
dark_gray='#313244'
red='#f38ba8'
gray='#45475a'
dark_purple='#6c7086'
"

# git --------------------------------------------
set -g @dracula-git-show-current-symbol ✓
set -g @dracula-git-show-diff-symbol !
set -g @dracula-git-show-remote-status true

# time -------------------------------------------
set -g @dracula-military-time true
set -g @dracula-day-month true
set -g @dracula-show-timezone false

# network ----------------------------------------
set -g @dracula-network-wifi-label " "
set -g @dracula-network-ethernet-label "󰈀 "

# battery ----------------------------------------
set -g @dracula-battery-label false
set -g @dracula-show-battery-status true


set -g @plugin 'christoomey/vim-tmux-navigator'
